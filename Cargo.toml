[package]
name = "carabao-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Small System One decision server for GGUF and llama.cpp"

[[bin]]
name = "carabao"
path = "src/main.rs"

[features]
default = ["native"]
native = ["dep:llama-cpp-2"]
cuda = ["native", "llama-cpp-2/cuda"]
vulkan = ["native", "llama-cpp-2/vulkan"]
metal = ["native", "llama-cpp-2/metal"]
rocm = ["native", "llama-cpp-2/rocm"]

[dependencies]
clap = { version = "4.6", features = ["derive", "std", "help", "usage"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
llama-cpp-2 = { version = "0.1.157", optional = true, default-features = false }
base64 = "0.22"
ctrlc = { version = "3.4", features = ["termination"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
